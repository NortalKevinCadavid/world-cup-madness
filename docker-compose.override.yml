# --------------------------------------------------------------------------
# DEV-ONLY: Keycloak sidecar for World Cup Madness local auth.
# --------------------------------------------------------------------------
# This compose override is auto-merged by Docker Compose when `supabase start`
# brings up the local stack. It adds a single sidecar: `oidc-stub`, running
# Keycloak 25 with a pre-baked realm (`infra/keycloak/realm-export.json`)
# containing four users whose IDs match the seeded `participants.auth_user_id`
# values in `supabase/seed/slice-001-fixture.sql`.
#
# Production uses Microsoft Entra ID (see `supabase/config.toml` —
# [auth.external.azure]). This sidecar is NEVER used in production.
#
# Why Keycloak (not mock-oauth2-server):
#   Supabase Auth's `keycloak` external provider hardcodes Keycloak's
#   URL conventions (`{issuer}/protocol/openid-connect/auth` etc.). The
#   previous `mock-oauth2-server:3.0.3` sidecar follows the OIDC discovery
#   spec but uses different paths (`{issuer}/authorize`), so Supabase's
#   redirects 404'd. Keycloak natively serves the URLs Supabase expects.
#
# Pre-seeded users (all password = "dev-password"):
#   alpha@nortal.com    — participant   (sub = 00000000-...000a)
#   bravo@nortal.com    — participant   (sub = 00000000-...000b)
#   charlie@nortal.com  — participant   (sub = 00000000-...000c)
#   admin1@nortal.com   — admin         (sub = 00000000-...00d3)
#
# Admin console:
#   URL:      http://localhost:8090/
#   Username: admin
#   Password: admin
# --------------------------------------------------------------------------

services:
  oidc-stub:
    # Keycloak 25 — pinned tag. Bump intentionally with a PR that re-runs the
    # slice-001 Playwright suite. NOTE: the service name stays `oidc-stub`
    # so Supabase config / env vars / existing docs continue to reference it.
    image: quay.io/keycloak/keycloak:25.0
    container_name: wcm-oidc-stub
    restart: unless-stopped
    command:
      - start-dev
      - --import-realm
      - --hostname-strict=false
      - --http-port=8090
      - --health-enabled=true
    ports:
      # Host port exposed for the browser sign-in flow AND for the Supabase
      # Auth container (which resolves the same host via host.docker.internal).
      - "8090:8090"
      # Management/health port (Keycloak 25 default).
      - "9000:9000"
    environment:
      # Bootstrap-admin credentials for the Keycloak admin console.
      # Keycloak 25 uses KC_BOOTSTRAP_ADMIN_*; earlier versions used KEYCLOAK_ADMIN_*.
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      # The realm import is read from /opt/keycloak/data/import/* at start-up.
      # Setting KC_LOG_LEVEL=info so the import progress is visible in `docker logs`.
      KC_LOG_LEVEL: "info"
      # Disable HTTPS for local dev; the realm is configured with sslRequired=none.
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      # Mount the realm JSON read-only at the import path Keycloak watches.
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      # Keycloak 25's discovery endpoint becomes available once the realm import completes.
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/localhost/8090 && echo -e 'GET /realms/default/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      default: {}
